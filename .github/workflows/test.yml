name: Tests
run-name: Run keycard-qt tests

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Qt version'
        required: false
        default: '6.7.2'
        type: string

jobs:
  # Multi-platform build and test
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds
          - os: ubuntu-22.04
            name: Linux
            qt_arch: gcc_64
            cmake_generator: "Unix Makefiles"
            
          # macOS builds  
          - os: macos-13
            name: macOS (Intel)
            qt_arch: clang_64
            cmake_generator: "Unix Makefiles"
            
          - os: macos-14
            name: macOS (ARM64)
            qt_arch: clang_64
            cmake_generator: "Unix Makefiles"
            
          # Windows builds
          - os: windows-2022
            name: Windows (MSVC)
            qt_arch: win64_msvc2019_64
            cmake_generator: "Visual Studio 17 2022"

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    
    env:
      QT_VERSION: ${{ inputs.qt_version || '6.7.2' }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Clean workspace if retrying job
        if: ${{ github.run_attempt > 1 }}
        shell: bash
        run: |
          git reset --hard
          git clean -xfd

      # Install Qt
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          cache: true
          modules: 'qtbase'

      # Linux-specific dependencies
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpcsclite-dev pkg-config libssl-dev
          
          echo "=== Verifying installations ==="
          pkg-config --modversion libpcsclite
          openssl version

      # macOS-specific setup
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          # PC/SC framework is already available on macOS
          # Just verify OpenSSL is available
          echo "=== Verifying installations ==="
          if [ -f "/System/Library/Frameworks/PCSC.framework/PCSC" ]; then
            echo "✓ PCSC framework found"
          else
            echo "⚠ PCSC framework not found at expected location"
          fi
          openssl version

      # Windows-specific setup
      - name: Setup Windows dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # winscard.lib is part of Windows SDK, should be available
          echo "=== Windows Environment ==="
          echo "OpenSSL version:"
          openssl version || echo "OpenSSL not in PATH"

      - name: Configure CMake
        shell: bash
        run: |
          mkdir -p build
          cd build
          
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake .. \
              -G "${{ matrix.cmake_generator }}" \
              -A x64 \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTING=ON
          else
            cmake .. \
              -G "${{ matrix.cmake_generator }}" \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTING=ON
          fi

      - name: Build
        shell: bash
        run: |
          cd build
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake --build . --config Release -j
          else
            cmake --build . -j$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)
          fi

      - name: Run tests
        shell: bash
        run: |
          cd build
          if [ "${{ runner.os }}" = "Windows" ]; then
            ctest --output-on-failure --verbose -C Release
          else
            ctest --output-on-failure --verbose
          fi

      - name: Test Summary
        if: always()
        shell: bash
        run: |
          if [ -f build/Testing/Temporary/LastTest.log ]; then
            echo "=== Test Results ==="
            cat build/Testing/Temporary/LastTest.log
          fi

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: keycard-qt-${{ matrix.name }}
          path: |
            build/libkeycard-qt.*
            build/keycard-qt.dll
            build/Release/keycard-qt.*
          if-no-files-found: ignore
          retention-days: 7

  # Linux Docker-based test (original test job)
  docker-test:
    runs-on: ubuntu-latest
    name: Linux (Docker Qt 6.9.2)
    container:
      image: harbor.status.im/status-im/status-desktop-build:1.0.5-qt6.9.2-android
      # Run as root to allow installing packages
    env:
      QT_VERSION: '6.9.2'
      QT_HOST: gcc_64
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Clean workspace if retrying job
        if: ${{ github.run_attempt > 1 }}
        run: |
          git reset --hard
          git clean -xfd

      - name: Setup environment
        shell: bash
        run: |
          set -e
          
          # Use Qt desktop (Linux) build instead of Android
          QT_PATH="/opt/qt/${{ env.QT_VERSION }}/gcc_64"
          
          echo "QT_PATH=$QT_PATH" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$QT_PATH" >> $GITHUB_ENV
          echo "Qt6_DIR=$QT_PATH/lib/cmake/Qt6" >> $GITHUB_ENV
          
          echo "$QT_PATH/bin" >> $GITHUB_PATH
          
          echo "Qt path: $QT_PATH"
          echo "CMake will look for Qt at: $QT_PATH/lib/cmake/Qt6"
          
          # Verify Qt installation
          if [ -d "$QT_PATH" ]; then
            echo "✓ Qt directory exists"
            ls -la "$QT_PATH/bin/" | grep -E "qmake|cmake" || true
          else
            echo "✗ Qt directory not found at $QT_PATH"
            echo "Available Qt installations:"
            ls -la /opt/qt/${{ env.QT_VERSION }}/ || true
            exit 1
          fi

      - name: Install dependencies
        run: |
          set -e
          echo "=== Installing PC/SC development headers ==="
          
          # Install PC/SC development libraries
          apt-get update -qq
          apt-get install -y libpcsclite-dev pkg-config
          
          echo ""
          echo "=== Verifying installations ==="
          
          # Check PC/SC headers (can be in /usr/include/PCSC/ or /usr/include/)
          if [ -f "/usr/include/PCSC/winscard.h" ] || [ -f "/usr/include/winscard.h" ]; then
            echo "✓ PC/SC headers found"
            find /usr/include -name "winscard.h" 2>/dev/null || true
          else
            echo "✗ PC/SC headers not found"
            find /usr -name "winscard.h" 2>/dev/null || true
            exit 1
          fi
          
          # Check pkg-config
          if pkg-config --exists libpcsclite; then
            echo "✓ PC/SC pkg-config found"
            pkg-config --modversion libpcsclite
          else
            echo "✗ PC/SC pkg-config not found"
            exit 1
          fi
          
          # Check OpenSSL
          if command -v openssl >/dev/null 2>&1; then
            echo "✓ OpenSSL found: $(openssl version)"
          else
            echo "✗ OpenSSL not found"
            exit 1
          fi

      - name: Configure CMake
        run: |
          set -e
          mkdir -p build
          cd build
          
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ env.QT_PATH }}" \
            -DQt6_DIR="${{ env.Qt6_DIR }}" \
            -DBUILD_TESTING=ON

      - name: Build
        run: |
          set -e
          cd build
          cmake --build . -j$(nproc)

      - name: Run tests
        run: |
          set -e
          cd build
          ctest --output-on-failure --verbose

      - name: Test Summary
        if: always()
        run: |
          if [ -f build/Testing/Temporary/LastTest.log ]; then
            echo "=== Test Results ==="
            cat build/Testing/Temporary/LastTest.log
          fi

  # Android build verification (runs on main/master or manually)
  android-build:
    runs-on: ubuntu-latest
    name: Android Build Verification
    # Only run on main/master branches or manual dispatch to save CI time
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    container:
      image: harbor.status.im/status-im/status-desktop-build:1.0.5-qt6.9.2-android
      options: --user jenkins
    env:
      QT_VERSION: ${{ inputs.qt_version || '6.9.2' }}
      ANDROID_ABI: arm64-v8a
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Setup Android environment
        shell: bash
        run: |
          set -e
          
          # Use Qt Android build
          QT_ANDROID_PATH="/opt/qt/${{ env.QT_VERSION }}/android_arm64_v8a"
          QT_HOST_PATH="/opt/qt/${{ env.QT_VERSION }}/gcc_64"
          
          echo "QT_ANDROID_PATH=$QT_ANDROID_PATH" >> $GITHUB_ENV
          echo "QT_HOST_PATH=$QT_HOST_PATH" >> $GITHUB_ENV
          echo "QT_DIR=$QT_ANDROID_PATH" >> $GITHUB_ENV
          echo "QTDIR=$QT_ANDROID_PATH" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$QT_ANDROID_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=/opt/android-sdk/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          
          echo "$QT_ANDROID_PATH/bin" >> $GITHUB_PATH
          echo "$QT_HOST_PATH/bin" >> $GITHUB_PATH
          
          echo "Qt Android path: $QT_ANDROID_PATH"
          echo "Qt Host path: $QT_HOST_PATH"
          
          # Verify Qt installations
          if [ -d "$QT_ANDROID_PATH" ]; then
            echo "✓ Qt Android directory exists"
          else
            echo "✗ Qt Android directory not found at $QT_ANDROID_PATH"
            exit 1
          fi
          
          if [ -d "$QT_HOST_PATH" ]; then
            echo "✓ Qt Host directory exists"
          else
            echo "✗ Qt Host directory not found at $QT_HOST_PATH"
            exit 1
          fi

      - name: Configure CMake for Android
        run: |
          set -e
          mkdir -p build-android
          cd build-android
          
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ env.ANDROID_ABI }} \
            -DANDROID_PLATFORM=android-26 \
            -DQT_HOST_PATH="${{ env.QT_HOST_PATH }}" \
            -DCMAKE_PREFIX_PATH="${{ env.QT_ANDROID_PATH }}" \
            -DCMAKE_FIND_ROOT_PATH="${{ env.QT_ANDROID_PATH }}" \
            -DQt6_DIR="${{ env.QT_ANDROID_PATH }}/lib/cmake/Qt6" \
            -DQt6CoreTools_DIR="${{ env.QT_HOST_PATH }}/lib/cmake/Qt6CoreTools" \
            -DBUILD_TESTS=OFF \

      - name: Build Android library and JAR
        run: |
          set -e
          cd build-android
          cmake --build . -j$(nproc)

      - name: Verify Android artifacts
        run: |
          set -e
          
          echo "=== Checking for Android artifacts ==="
          
          # Check for library
          if [ -f "build-android/libkeycard-qt.so" ] || [ -f "build-android/libkeycard-qt.a" ]; then
            echo "✓ Android library built successfully"
          else
            echo "⚠ Android library not found (may be in subdirectory)"
            find build-android -name "libkeycard-qt.*" || true
          fi
          
          # Check for JAR
          if [ -f "build-android/android/keycard-qt-*.jar" ]; then
            echo "✓ Android JAR built successfully"
            ls -lh build-android/android/keycard-qt-*.jar
          else
            echo "⚠ Android JAR not found"
            find build-android -name "*.jar" || true
          fi

